[project]
name        = "monolithium"
description = "🗿 Minecraft alpha monoliths seed cruncher"
version     = "1.3.1"
readme      = "readme.md"
license     = "MIT"
requires-python = ">=3.10"
dependencies = [
    "meson",
    "ninja",
    "rustbin",
]

[project.urls]
GitHub = "https://github.com/Tremeschin/Monolithium"

[project.optional-dependencies]
statistics = [
    "altair",
    "attrs",
    "numpy",
    "scipy",
    "vl-convert-python",
]

[project.scripts]
cudalith = "monolithium.__main__:_cudalith"
rustlith = "monolithium.__main__:_rustlith"
statlith = "monolithium.statistics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
